name: cblaze-watchdog

# 免费实例看门狗：每小时探一次，停了就 power start
# 外部触发腿：cron-job.org 定时打 workflow_dispatch（GitHub 原生 schedule 常不 fire）
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: cblaze-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: 探测 + 必要时拉起
        env:
          CBLZ_COOKIES: ${{ secrets.CBLZ_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 watch.py

      - name: 写入 run 摘要
        if: always()
        run: echo "- $(date -u '+%F %T UTC') watchdog done" >> $GITHUB_STEP_SUMMARY
